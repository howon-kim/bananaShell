name: macOS build

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build with SwiftPM
        run: swift build

      - name: Build the Xcode project
        run: |
          xcodebuild -project bananaShell.xcodeproj -scheme bananaShell -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build | tail -n 40
          test "${PIPESTATUS[0]}" -eq 0

      - name: Run checks
        run: Scripts/run-checks.sh
